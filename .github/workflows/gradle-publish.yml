name: Build and Release

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew shadowJar

      - name: Get project version
        id: get_version
        run: echo "version=$(grep "version = '" build.gradle | cut -d"'" -f2)" >> $GITHUB_OUTPUT

      - name: Get Minecraft version
        id: get_mc
        run: echo "mc=$(grep 'api-version' src/main/resources/plugin.yml | cut -d'"' -f2)" >> $GITHUB_OUTPUT

      - name: Update README Minecraft version
        run: |
          sed -i "s|<!-- mc-version -->.*<!-- /mc-version -->|<!-- mc-version -->${{ steps.get_mc.outputs.mc }}<!-- /mc-version -->|" ReadMe.md
          if ! git diff --quiet ReadMe.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ReadMe.md
            git commit -m "Update README Minecraft version to ${{ steps.get_mc.outputs.mc }} [skip ci]"
            git push
          fi

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./build/libs/Portel-*.jar
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          body: |
            **Minecraft version:** ${{ steps.get_mc.outputs.mc }}

            Automated release based on commit ${{ github.sha }}.
          draft: false
          prerelease: false
